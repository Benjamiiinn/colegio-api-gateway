server:
  port: 9090

spring:
  application:
    name: api-gateway
  main:
      web-application-type: reactive
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
      - id: user-service-auth
        uri: lb://USER-SERVICE
        predicates:
          - Path=/api/v1/auth/**
        filters:
          - name: CircuitBreaker
            args:
              name: userServiceCB
              # fallbackUri: forward:/fallback/userServiceFallback

      - id: user-service-usuarios
        uri: lb://USER-SERVICE
        predicates:
          - Path=/api/v1/usuarios/**
        filters:
          - name: CircuitBreaker
            args:
              name: userServiceCB
              # fallbackUri: forward:/fallback/userServiceFallback

      - id: academy-service
        uri: lb://ACADEMY-SERVICE
        predicates:
          - Path=/api/v1/cursos/**,/api/v1/asignaturas/**,/api/v1/matriculas/**,/api/v1/calificaciones/**
        filters:
          - name: CircuitBreaker
            args:
              name: academyServiceCB
              # fallbackUri: forward:/fallback/academyServiceFallback

      - id: records-service
        uri: lb://RECORDS-SERVICE
        predicates:
          - Path=/api/v1/asistencias/**,/api/v1/anotaciones/**
        filters:
          - name: CircuitBreaker
            args:
              name: recordsServiceCB
              # fallbackUri: forward:/fallback/recordsServiceFallback
      httpclient:
        connect-timeout: 20000
        response-timeout: 120s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${EUREKA_INSTANCE_IP_ADDRESS:127.0.0.1}:${spring.application.name}:${server.port}
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS:127.0.0.1}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

resilience4j:
  circuitbreaker:
    config:
      default:
        timeout: 30s
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2s
      instances:
        userServiceCB:
          slidingWindowSize: 10
          minimumNumberOfCalls: 5
          failureRateThreshold: 50
          waitDurationInOpenState: 10s
        academyServiceCB:
          slidingWindowSize: 10
          minimumNumberOfCalls: 5
          failureRateThreshold: 50
          waitDurationInOpenState: 10s
        recordServiceCB:
          slidingWindowSize: 10
          minimumNumberOfCalls: 5
          failureRateThreshold: 50
          waitDurationInOpenState: 10s
  timelimiter:
    instances:
      userServiceCB:
        timeoutDuration: 30s
        cancelRunningFuture: true
      academyServiceCB:
        timeoutDuration: 30s
        cancelRunningFuture: true
      recordServiceCB:
        timeoutDuration: 30s
        cancelRunningFuture: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    reactor.netty: DEBUG
    resilience4j: DEBUG
    io.github.resilience4j: DEBUG
